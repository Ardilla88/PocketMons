<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebMon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="version-watermark"></div>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <!-- Overworld Controls -->
            <div id="controls">
                <div id="dpad">
                    <div class="dpad-row">
                        <div class="dpad-btn" data-dir="up">▲</div>
                    </div>
                    <div class="dpad-row">
                        <div class="dpad-btn" data-dir="left">◀</div>
                        <div class="dpad-center"></div>
                        <div class="dpad-btn" data-dir="right">▶</div>
                    </div>
                    <div class="dpad-row">
                        <div class="dpad-btn" data-dir="down">▼</div>
                    </div>
                </div>
                <div id="action-area">
                    <div id="menu-btn">☰</div>
                </div>
            </div>

            <!-- Battle UI -->
            <div id="battle-ui" class="hidden">
                <!-- HUD Overlay -->
                <div id="battle-hud">
                    <!-- Enemy Status (Top Left) -->
                    <div id="enemy-status" class="status-panel">
                        <div class="status-row">
                            <span id="enemy-name">Name</span>
                            <span id="enemy-lvl">Lv1</span>
                        </div>
                        <div class="hp-bar-bg">
                            <div id="enemy-hp-bar" class="hp-bar-fill"></div>
                        </div>
                        <div class="status-text">
                            <span id="enemy-hp-text"></span>
                        </div>
                    </div>

                    <!-- Player Status (Bottom Right) -->
                    <div id="player-status" class="status-panel">
                        <div class="status-row">
                            <span id="player-name">Name</span>
                            <span id="player-lvl">Lv1</span>
                        </div>
                        <div class="hp-bar-bg">
                            <div id="player-hp-bar" class="hp-bar-fill"></div>
                        </div>
                        <div class="status-text">
                            <span id="player-hp-text">20/20</span>
                        </div>
                        <div class="xp-bar-bg">
                            <div id="player-xp-bar" class="xp-bar-fill"></div>
                        </div>
                    </div>
                </div>

                <div class="battle-info-box" id="battle-log"></div>

                <!-- Battle Main Menu -->
                <div id="battle-main-menu" class="battle-controls">
                    <div style="flex:1; display:flex; flex-direction:column; gap:5px;">
                        <button id="btn-attack" class="ui-btn btn-red">Attack</button>
                        <button id="btn-pkmn" class="ui-btn btn-blue">Pkmn</button>
                    </div>
                    <div style="flex:1; display:flex; flex-direction:column; gap:5px;">
                        <button id="btn-bag" class="ui-btn btn-yellow">Bag</button>
                        <button id="btn-run" class="ui-btn">Run</button>
                    </div>
                </div>

                <!-- Battle Submenus (Bag/Pkmn) overlay -->
                <div id="battle-submenu" class="hidden">
                     <h3 id="battle-submenu-title" style="margin-bottom:5px;">Title</h3>
                     <div id="battle-submenu-content" style="max-height:150px; overflow-y:auto;"></div>
                     <button id="btn-battle-back" class="ui-btn" style="margin-top:5px;">Back</button>
                </div>
            </div>

            <!-- Evolution Screen -->
            <div id="evolution-screen" class="hidden" style="position:absolute; top:0; left:0; width:100%; height:100%; background:#000; z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; text-align:center;">
                <div id="evolution-text" style="margin-bottom:20px; font-size:20px;">What? It's evolving!</div>
                <canvas id="evolution-canvas" width="300" height="300" style="border:2px solid white; background:#222;"></canvas>
                <button id="btn-evolution-ok" class="ui-btn btn-yellow hidden" style="margin-top:20px; width:200px;">Awesome!</button>
            </div>

            <!-- Menu UI -->
            <div id="menu-ui" class="hidden">
                <div class="menu-box">
                    <h2>PAUSE</h2>
                    <button id="btn-menu-team" class="ui-btn">Team</button>
                    <button id="btn-menu-bag" class="ui-btn">Bag</button>
                    <button id="btn-menu-close" class="ui-btn btn-red">Resume</button>
                </div>
            </div>

            <!-- Submenu UI (Team/Bag details) -->
            <div id="submenu-ui" class="hidden">
                <div class="menu-box">
                    <h2 id="submenu-title">TITLE</h2>
                    <div id="submenu-content">
                        <!-- List items will be injected here -->
                    </div>
                    <button id="btn-submenu-back" class="ui-btn btn-yellow">Back</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
